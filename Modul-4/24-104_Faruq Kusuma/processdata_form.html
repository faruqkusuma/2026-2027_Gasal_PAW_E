<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>process_data</title>
</head>
<body>
	<h1>Data diri</h1>
	<form action="procesdata.php" method="POST">
        <label for="surname">Surname:</label>
        <input type="text" id="surname" name="surname">
        <br></br>
        <label for="email">Email address:</label>
        <input type="email" id="email" name="email">
        <br></br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br></br>
        <label for="address">Street Address:</label>
        <textarea id="address" name="address" rows="4" cols="30"></textarea>
        <br></br>
        <label for="state">State:</label>
        <select id="state" name="state">
            <option value="">Country</option>
            <option value="id">Indonesia</option>
            <option value="as">Australia</option>
        </select>
        <input type="hidden" name="country" value="Australia">
        <br></br>
        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
        <br></br>
        <input type="checkbox" id="vegetarian" name="vegetarian" value="Yes">
        <label for="vegetarian">Vegetarian?</label>
        <input type="submit" value="Submit" class="btn-grup">
        <input type="reset" value="Reset">

    </form>
</body>
</html>
